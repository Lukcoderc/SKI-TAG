<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Branchenstandard – Skizze</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#0a0a0b;color:#f5f5f7;font-family:"Helvetica Neue",Arial,sans-serif;text-align:center}
  .kopf{display:flex;justify-content:space-between;padding:36px 64px;font-size:24px;color:#a1a1a6}
  .kopf b{color:#f5f5f7}
  h1{margin:40px 0 0;font-size:84px;letter-spacing:-.03em}
  p{font-size:26px;color:#a1a1a6;margin:18px 0 0}
  .knopf{display:inline-block;margin-top:30px;background:#2d7ff9;color:#fff;font-size:24px;padding:16px 36px;border-radius:30px}
  .geraet{margin:44px auto 0;width:300px;height:300px;border-radius:70px;background:linear-gradient(145deg,#2a2a2e,#121214);box-shadow:0 40px 80px rgba(0,0,0,.6)}
  .geraet i{display:block;width:120px;height:120px;border-radius:50%;margin:90px auto;background:#1c1c1f;border:3px solid #3a3a3f}
</style>
</head>
<body>
<header class="kopf"><b>SkiTag</b><span>Funktionen · App · Preise · Kontakt</span></header>
<h1>Sicherheit auf der Piste.</h1>
<p>Ein Chip. Ein Knopf. Hilfe ohne Handy.</p>
<span class="knopf">Jetzt mieten</span>
<div class="geraet"><i></i></div>
</body>
</html>
