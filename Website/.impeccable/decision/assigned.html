<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Die Station – Skizze</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#141617;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;color:#eceee9}
  .beton{position:absolute;inset:0;background:
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.035) 0 1px,transparent 2px) 0 0/7px 7px,
    linear-gradient(180deg,#2b2f31,#1c1f20);}
  .fuge{position:absolute;left:0;right:0;height:2px;background:#151718}
  .oeffnung{position:absolute;left:120px;top:96px;width:1200px;height:600px;overflow:hidden;border-radius:2px;
    background:linear-gradient(180deg,#05070b 0%,#0d1520 55%,#1a2532 100%);box-shadow:inset 0 30px 60px rgba(0,0,0,.7)}
  .oeffnung svg{position:absolute;inset:0}
  .schild{position:absolute;left:184px;top:520px;background:#eceee9;color:#141617;padding:30px 40px 34px;border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,.45)}
  .schild h1{margin:0;font-size:68px;line-height:1;letter-spacing:-.01em;font-weight:700}
  .schild p{margin:14px 0 0;font-size:24px;color:#3a3e40;max-width:560px}
  .miete{position:absolute;right:184px;top:560px;display:flex;flex-direction:column;gap:10px}
  .plate{display:flex;align-items:center;gap:22px;background:#1c1f20;border:2px solid #8d949a;border-radius:6px;padding:16px 26px;min-width:300px;font-size:30px;font-weight:700}
  .plate b{color:#e2b13c;font-size:34px}
  .plate.aktiv{background:#e2b13c;color:#141617;border-color:#e2b13c}
  .plate.aktiv b{color:#141617}
  .kopf{position:absolute;left:120px;top:36px;right:120px;display:flex;justify-content:space-between;align-items:center}
  .marke{font-size:30px;font-weight:700;letter-spacing:.02em}
  .nav{display:flex;gap:40px;font-size:24px;color:#8d949a}
</style>
</head>
<body>
<div class="beton"></div>
<div class="fuge" style="top:300px"></div><div class="fuge" style="top:620px"></div>
<header class="kopf"><div class="marke">SkiTag</div><nav class="nav"><span>Der Knopf</span><span>Das Netz</span><span>Wir</span><span>Mieten</span></nav></header>
<div class="oeffnung">
  <svg viewBox="0 0 1200 600" preserveAspectRatio="none">
    <path d="M0 360 L180 250 L300 300 L470 170 L620 260 L760 190 L930 280 L1080 210 L1200 260 L1200 600 L0 600Z" fill="#1f2b38"/>
    <path d="M0 430 L220 340 L380 400 L560 320 L720 390 L900 330 L1200 400 L1200 600 L0 600Z" fill="#2c3a48"/>
    <path d="M0 500 L300 440 L640 480 L1200 430 L1200 600 L0 600Z" fill="#c9d2da" opacity=".85"/>
    <line x1="-20" y1="120" x2="1220" y2="300" stroke="#8d949a" stroke-width="3"/>
    <g transform="translate(780 236)"><rect x="-26" y="10" width="52" height="40" rx="6" fill="#2b2f31" stroke="#8d949a" stroke-width="2"/><line x1="0" y1="-8" x2="0" y2="10" stroke="#8d949a" stroke-width="3"/><rect x="-18" y="18" width="36" height="14" fill="#e2b13c" opacity=".8"/></g>
    <circle cx="470" cy="470" r="5" fill="#eceee9"/>
  </svg>
</div>
<div class="schild"><h1>Ein Knopf statt eines Anrufs.</h1><p>Der Mietchip für die Jacke. Halten, und die Bergbahn weiß, wo du bist.</p></div>
<div class="miete"><div class="plate aktiv"><b>→</b>Chip für einen Tag</div><div class="plate"><b>→</b>Für die ganze Saison</div></div>
</body>
</html>
