<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Alpenvereinskarte – Skizze</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#f7f8f6;color:#1d2124;font-family:"Helvetica Neue",Arial,sans-serif}
  svg.karte{position:absolute;inset:0}
  .kopf{position:absolute;left:64px;right:64px;top:36px;display:flex;justify-content:space-between;align-items:baseline;font-size:24px;color:#5a6066}
  .kopf b{color:#1d2124;font-size:30px;letter-spacing:.01em}
  .text{position:absolute;left:64px;top:210px;width:520px}
  h1{margin:0;font-size:84px;line-height:.98;letter-spacing:-.02em;font-weight:600}
  .text p{font-size:26px;color:#5a6066;margin:24px 0 0;max-width:460px}
  .chip{position:absolute;left:760px;top:250px;width:320px;height:320px;border-radius:96px;background:#fdfdfc;
    box-shadow:0 30px 60px rgba(29,33,36,.18),0 2px 0 #fff inset;border:1px solid #d9dedb}
  .chip i{position:absolute;left:90px;top:90px;width:140px;height:140px;border-radius:50%;background:#eef0ee;border:2px solid #c6ccc9}
  .chip em{position:absolute;left:150px;top:44px;width:20px;height:6px;border-radius:3px;background:#b8c0bd}
  .platz{position:absolute;left:760px;top:600px;width:320px;text-align:center;font-size:22px;color:#5a6066}
  .legende{position:absolute;right:64px;bottom:64px;width:360px;border:2px solid #1d2124;background:#fff;padding:24px 26px}
  .legende h2{margin:0 0 16px;font-size:22px;letter-spacing:.08em}
  .zeile{display:flex;align-items:center;gap:16px;font-size:26px;padding:10px 0;border-top:1px solid #e4e8e6}
  .zeile .z{width:28px;height:4px;background:#1d2124}
  .zeile .g{width:28px;height:0;border-top:4px dashed #1d2124}
  .los{margin-top:16px;background:#4f8fbf;color:#fff;font-size:26px;font-weight:700;padding:16px;text-align:center}
</style>
</head>
<body>
<svg class="karte" viewBox="0 0 1440 900" fill="none" stroke="#9a6b45" stroke-width="1.4" opacity=".55">
  <path d="M-20 700 C200 640 380 720 560 650 S900 520 1460 600"/>
  <path d="M-20 640 C220 580 400 660 600 590 S900 450 1460 530"/>

  <path d="M-20 460 C280 420 470 480 690 410 S1010 260 1460 320"/>

  <path d="M-20 340 C320 320 520 360 740 290 S1080 150 1460 180"/>
  <path d="M-20 280 C340 270 560 300 770 230 S1120 100 1460 110"/>
  <path d="M1160 140 C1220 120 1300 150 1330 200 C1290 230 1220 220 1160 140Z" stroke="#4f8fbf" fill="#e3eef6" opacity="1"/>
  <path d="M1080 700 L1150 640 L1240 680" stroke="#1d2124" stroke-dasharray="8 8" opacity="1"/>
  <circle cx="1240" cy="680" r="8" fill="#1d2124" stroke="none" opacity="1"/>

<header class="kopf"><b>SkiTag</b><span>Der Knopf · Das Netz · Wir · Mieten</span></header>
<div class="text"><h1>Ein Knopf statt eines Anrufs.</h1><p>Der Mietchip für die Jacke. Halten, und die Bergbahn weiß, wo du bist.</p></div>
<div class="chip"><em></em><i></i></div>
<div class="platz">Platzhalter: Foto des Chips</div>
<div class="legende"><h2>CHIP MIETEN</h2>
  <div class="zeile"><span class="z"></span>Ein Tag</div>
  <div class="zeile"><span class="g"></span>Ganze Saison</div>
  <div class="los">Weiter</div></div>
</body>
</html>
