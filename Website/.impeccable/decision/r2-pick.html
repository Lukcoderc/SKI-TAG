<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Neuschnee – Skizze</title>
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;color:#1b2430;font-family:"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(ellipse at 50% 70%,#ffffff 0%,#f3f7fb 55%,#e3ecf5 100%)}
  .kopf{position:absolute;left:64px;right:64px;top:36px;display:flex;justify-content:space-between;font-size:24px;color:#5d6b7c}
  .kopf b{color:#1b2430;font-size:30px}
  h1{position:absolute;left:0;right:0;top:130px;margin:0;text-align:center;font-size:96px;letter-spacing:-.03em;font-weight:600}
  .unter{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:26px;color:#5d6b7c}
  .schatten{position:absolute;left:560px;top:640px;width:340px;height:60px;border-radius:50%;background:#a9bfd6;filter:blur(18px);opacity:.7}
  .chip{position:absolute;left:580px;top:360px;width:300px;height:300px;border-radius:90px;background:#fbfcfd;border:1px solid #d7e0ea;box-shadow:0 24px 50px rgba(27,36,48,.15)}
  .chip i{position:absolute;left:85px;top:85px;width:130px;height:130px;border-radius:50%;background:#eef2f6;border:2px solid #c9d4e0}
  .platz{position:absolute;left:0;right:0;top:700px;text-align:center;font-size:22px;color:#4f5d6e}
  .wahl{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;gap:16px;font-size:26px}
  .wahl span{padding:14px 30px;border:1px solid #b7c6d6;border-radius:40px;background:#fff}
  .wahl .los{background:#1b2430;color:#fff;border-color:#1b2430;font-weight:700}
</style>
</head>
<body>
<header class="kopf"><b>SkiTag</b><span>Der Knopf · Das Netz · Wir · Mieten</span></header>
<h1>Ein Knopf statt eines Anrufs.</h1>
<p class="unter">Der Mietchip für die Jacke. Halten, und die Bergbahn weiß, wo du bist.</p>
<div class="schatten"></div><div class="chip"><i></i></div>
<div class="platz">Platzhalter: Foto des Chips im Schnee</div>
<div class="wahl"><span>Ein Tag</span><span>Ganze Saison</span><span class="los">Chip mieten</span></div>
</body>
</html>
